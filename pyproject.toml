[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pitman-yor-dp"
version = "0.1.0"
description = "Research utilities for Dirichlet-process and Pitman--Yor cardinality priors in multitarget tracking."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Florian Pfaff" }
]
dependencies = [
  "numpy>=1.24"
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "matplotlib>=3.8"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
