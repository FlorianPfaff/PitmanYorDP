name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: |
          set +e
          pytest -q --tb=short 2>&1 | tee pytest-${{ matrix.python-version }}.log
          status=${PIPESTATUS[0]}
          echo "pytest_exit_status=${status}" >> "$GITHUB_ENV"
          exit ${status}
      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ matrix.python-version }}
          path: pytest-${{ matrix.python-version }}.log
      - name: Run synthetic example smoke test
        run: python examples/synthetic_gating_experiment.py > /tmp/synthetic_gating.json
